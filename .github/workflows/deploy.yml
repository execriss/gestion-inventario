name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Mensaje del deploy (opcional)'
        required: false
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'PENDIENTES.md'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 5fc61187a89a618cb4a159206184f5c9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias (lockfile exacto)
        run: npm ci

      - name: Limpiar artefactos stale
        run: rm -rf .next .open-next .wrangler

      - name: Build con OpenNext
        run: npx opennextjs-cloudflare build

      - name: Deploy a Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
